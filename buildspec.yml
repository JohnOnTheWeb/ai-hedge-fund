# CodeBuild buildspec — single ARM64 image serving AgentCore Runtime,
# Fargate analyst-driver, and 7 Lambda handlers (CMD override per consumer).
#
# Env vars injected by the CodeBuild project (see platform_stack.py):
#   AWS_ACCOUNT_ID, AWS_REGION, ECR_REPOSITORY, ECR_URI
#   IMAGE_SSM_URI, IMAGE_SSM_DIGEST, IMAGE_SSM_TAG
version: 0.2

env:
  variables:
    DOCKERFILE: "Dockerfile.app"
    IMAGE_PLATFORM: "linux/arm64"

phases:
  pre_build:
    commands:
      - echo "CodeBuild started at $(date -u +%FT%TZ)"
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
      - GIT_SHA="${CODEBUILD_RESOLVED_SOURCE_VERSION:-local}"
      - SHORT_SHA=$(echo "$GIT_SHA" | cut -c1-12)
      - echo "Will push $ECR_URI:$SHORT_SHA and $ECR_URI:latest"

  build:
    commands:
      - docker buildx create --use --name aihedgebuilder 2>/dev/null || docker buildx use aihedgebuilder
      - docker buildx inspect --bootstrap
      - docker buildx build
          --platform "$IMAGE_PLATFORM"
          --provenance=false
          --file "$DOCKERFILE"
          --tag "$ECR_URI:latest"
          --tag "$ECR_URI:$SHORT_SHA"
          --push
          .

  post_build:
    commands:
      - DIGEST=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$SHORT_SHA" --query 'imageDetails[0].imageDigest' --output text)
      - aws ssm put-parameter --name "$IMAGE_SSM_URI" --value "$ECR_URI" --type String --overwrite
      - aws ssm put-parameter --name "$IMAGE_SSM_TAG" --value "$SHORT_SHA" --type String --overwrite
      - aws ssm put-parameter --name "$IMAGE_SSM_DIGEST" --value "$DIGEST" --type String --overwrite
      - printf '{"imageUri":"%s","imageTag":"%s","imageDigest":"%s"}\n' "$ECR_URI" "$SHORT_SHA" "$DIGEST" > imageDetail.json
      # Force the AgentCore Runtime to re-pull :latest (it pins by digest internally, so a new
      # :latest tag without a control-plane nudge is invisible). Best-effort; skipped when the
      # Runtime doesn't exist yet (first deploy, agentCoreEnabled=false).
      - |
        RUNTIME_ID=$(aws bedrock-agentcore-control list-agent-runtimes \
            --query "agentRuntimes[?agentRuntimeName=='aihedge_runtime'].agentRuntimeId | [0]" \
            --output text 2>/dev/null || true)
        if [ -n "$RUNTIME_ID" ] && [ "$RUNTIME_ID" != "None" ]; then
          echo "Updating AgentCore Runtime $RUNTIME_ID to pick up $SHORT_SHA"
          aws bedrock-agentcore-control update-agent-runtime \
              --agent-runtime-id "$RUNTIME_ID" \
              --agent-runtime-artifact "containerConfiguration={containerUri=$ECR_URI:$SHORT_SHA}" \
              --network-configuration '{"networkMode":"PUBLIC"}'
        else
          echo "No AgentCore Runtime yet; skipping update."
        fi

artifacts:
  files:
    - imageDetail.json
